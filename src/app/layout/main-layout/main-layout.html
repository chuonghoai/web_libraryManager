<div class="flex h-screen bg-[#F8FAFC] font-sans text-[14px] text-[#1E3A5F]">
    <aside class="w-64 bg-white shadow-sm flex flex-col border-r border-[#E2E8F0]">
        <div class="p-4 border-b border-[#E2E8F0]">
            <h2 class="text-[24px] leading-[32px] font-bold font-serif text-[#1E3A5F]">Library Manager</h2>
        </div>

        <nav class="flex-1 p-4 space-y-2">
            @for (item of menuItems; track item.route) {
            <a [routerLink]="item.route" routerLinkActive="bg-[#EFF6FF] text-[#1E3A5F] font-semibold border-[#1E3A5F]"
                class="flex items-center p-2 rounded text-[#6B7280] hover:bg-[#F8FAFC] hover:text-[#1E3A5F] border-l-2 border-transparent transition-colors">
                <span>{{ item.label }}</span>
            </a>
            }
        </nav>

        <div class="p-4 border-t border-[#E2E8F0] text-[12px] text-[#6B7280] font-medium">
            {{ appVersion }}
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="container mx-auto">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
