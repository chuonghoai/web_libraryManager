<div class="flex h-screen bg-gray-100">
    <aside class="w-64 bg-white shadow-md flex flex-col">
        <div class="p-6 border-b">
            <h2 class="text-xl font-bold text-blue-600">Library Manager</h2>
        </div>

        <nav class="flex-1 p-4 space-y-2">
            @for (item of menuItems; track item.route) {
            <a [routerLink]="item.route" routerLinkActive="bg-blue-50 text-blue-600 font-semibold"
                class="flex items-center p-3 rounded-lg text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition-colors">
                <span>{{ item.label }}</span>
            </a>
            }
        </nav>

        <div class="p-4 border-t text-sm text-gray-500">
            v1.0.0
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <div class="container mx-auto">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
