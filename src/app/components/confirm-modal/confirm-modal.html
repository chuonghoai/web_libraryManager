<div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-60 flex justify-center items-center p-4"
     (click)="onCancel()">
    
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden animate-zoom-in"
         (click)="$event.stopPropagation()">
         
        <div class="p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-2">{{ title }}</h3>
            <p class="text-gray-600">{{ message }}</p>
        </div>

        <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3">
            <button (click)="onCancel()"
                class="px-4 py-2 text-gray-700 bg-white border border-gray-300 hover:bg-gray-100 rounded-lg font-medium transition-colors">
                {{ cancelText }}
            </button>
            <button (click)="onConfirm()"
                class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium shadow-md transition-colors">
                {{ confirmText }}
            </button>
        </div>
    </div>
</div>
