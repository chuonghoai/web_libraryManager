<div class="fixed inset-0 bg-[#0F172A]/12 backdrop-blur-sm z-50 flex justify-center items-center p-4 font-sans"
    (click)="cancel.emit()">

    <div class="bg-white rounded-md shadow-lg w-full max-w-lg overflow-hidden animate-zoom-in"
        (click)="$event.stopPropagation()">

        <div class="px-4 py-3 border-b border-[#E2E8F0] flex justify-between items-center">
            <h3 class="text-[18px] leading-[26px] font-semibold font-serif text-[#1E3A5F]">
                {{ bookData ? 'Chỉnh sửa sách' : 'Thêm sách mới' }}
            </h3>
            <button (click)="cancel.emit()" class="text-[#6B7280] hover:text-[#1E3A5F]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" class="p-4 space-y-4">
            <div>
                <label class="block text-[13px] font-medium text-[#1E3A5F] mb-1">Tiêu đề sách</label>
                <input type="text" formControlName="title"
                    class="w-full h-[36px] bg-white border border-[#CBD5E1] rounded px-3 focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/15 text-[14px] text-[#1E3A5F] transition-all"
                    placeholder="Nhập tên sách...">
            </div>

            <div>
                <label class="block text-[13px] font-medium text-[#1E3A5F] mb-1">Số lượng tồn kho</label>
                <input type="number" formControlName="stock"
                    class="w-full h-[36px] bg-white border border-[#CBD5E1] rounded px-3 focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/15 text-[14px] text-[#1E3A5F] transition-all"
                    min="0">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[13px] font-medium text-[#1E3A5F] mb-1">Tác giả</label>
                    <input type="text" formControlName="author"
                        class="w-full h-[36px] bg-white border border-[#CBD5E1] rounded px-3 focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/15 text-[14px] text-[#1E3A5F] transition-all"
                        placeholder="Nhập tên tác giả">
                </div>
                <div>
                    <label class="block text-[13px] font-medium text-[#1E3A5F] mb-1">Năm xuất bản</label>
                    <input type="number" formControlName="publishedYear"
                        class="w-full h-[36px] bg-white border border-[#CBD5E1] rounded px-3 focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/15 text-[14px] text-[#1E3A5F] transition-all">
                </div>
            </div>

            <div>
                <label class="block text-[13px] font-medium text-[#1E3A5F] mb-1">Mô tả</label>
                <textarea formControlName="description" rows="3"
                    class="w-full bg-white border border-[#CBD5E1] rounded p-3 focus:outline-none focus:border-[#1E3A5F] focus:ring-2 focus:ring-[#1E3A5F]/15 text-[14px] text-[#1E3A5F] transition-all resize-y"
                    placeholder="Nhập mô tả ngắn gọn về sách..."></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-4 mt-2 border-t border-[#E2E8F0]">
                <button type="button" (click)="cancel.emit()"
                    class="px-4 h-[36px] text-[#1E3A5F] bg-white border border-[#CBD5E1] hover:bg-[#F1F5F9] rounded font-medium transition-colors text-[14px]">
                    Hủy bỏ
                </button>
                <button type="submit" [disabled]="bookForm.invalid"
                    class="px-4 h-[36px] bg-[#1E3A5F] hover:bg-[#162D4A] disabled:opacity-45 disabled:hover:bg-[#1E3A5F] disabled:cursor-not-allowed text-white rounded font-medium transition-colors text-[14px]">
                    Lưu thông tin
                </button>
            </div>
        </form>
    </div>
</div>
